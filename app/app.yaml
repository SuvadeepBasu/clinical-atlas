command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000"]
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # The AI model from Part 7, exactly as Unity Gateway names it (system.ai.<model>)
  - name: MODEL_NAME
    value: "system.ai.gpt-oss-120b"
  - name: ATLAS_SCHEMA
    value: "workspace.atlas"
  - name: REPORTS_VOLUME
    value: "/Volumes/workspace/atlas/reports"
  # Optional: uncomment after adding the matching resources in the app settings
  # - name: GENIE_SPACE_ID
  #   valueFrom: genie-space
  # - name: MLFLOW_EXPERIMENT_ID
  #   valueFrom: experiment
